<title>Crafting Profit Plan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<style>
/* Layout: sticky brass header with search, guild-ledger sidebar of sections, one section open at a time */
:root{
  --bg:#efe6d2; --panel:#e5d9bf; --card:#f7f0e1; --ink:#2a2017; --muted:#6c5b44; --line:#cdbb94;
  --brass:#87601b; --brass-soft:rgba(135,96,27,.13); --blue:#2e5b7a; --good:#3d6b35; --mark:#f0c96a;
  --display:"Cinzel",Georgia,"Times New Roman",serif; --body:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1a1511; --panel:#231d17; --card:#2a231c; --ink:#ece1c9; --muted:#b2a283; --line:#3e3429;
  --brass:#d6a94c; --brass-soft:rgba(214,169,76,.14); --blue:#7fb0d3; --good:#8fc07f; --mark:#7a5a17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1a1511; --panel:#231d17; --card:#2a231c; --ink:#ece1c9; --muted:#b2a283; --line:#3e3429;
  --brass:#d6a94c; --brass-soft:rgba(214,169,76,.14); --blue:#7fb0d3; --good:#8fc07f; --mark:#7a5a17; color-scheme:dark}
*{box-sizing:border-box} [hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:17px/1.55 var(--body);font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
a{color:var(--brass)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:2px solid var(--brass);
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hd{max-width:1180px;margin:0 auto;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;min-width:0;flex:1 1 260px}
.brand h1{font:700 1.35rem/1.15 var(--display);margin:0;letter-spacing:.02em;text-wrap:balance}
.brand span{color:var(--muted);font-size:.85rem}
.search{flex:1 1 300px;position:relative}
.search input{width:100%;font:inherit;font-size:1rem;padding:9px 36px 9px 12px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
.search input:focus{outline:2px solid var(--brass);outline-offset:1px}
.search button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);font-size:1.2rem;cursor:pointer;padding:2px 6px}
.wrap{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:210px minmax(0,1fr);gap:28px;
  padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 90px);align-self:start;display:flex;flex-direction:column;gap:14px}
.ngl{font:600 .7rem var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.nv{display:block;padding:5px 10px;border-radius:5px;text-decoration:none;color:var(--ink);border-left:2px solid transparent}
.nv:hover{background:var(--brass-soft)}
.nv.on{background:var(--brass-soft);border-left-color:var(--brass);font-weight:700}
.nv:focus-visible,.tab:focus-visible,button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
main{min-width:0}
.glance{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:22px}
.gl{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--brass);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.gl span{font:600 .68rem var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.gl b{font-size:1.2rem}
.gl em{font-style:normal;color:var(--muted);font-size:.85rem}
.sec{max-width:880px}
.sec[hidden]{display:none}
.eyebrow{font:600 .7rem var(--display);letter-spacing:.16em;text-transform:uppercase;color:var(--brass)}
h2{font:700 1.6rem/1.2 var(--display);margin:.15em 0 .6em;text-wrap:balance}
h3{font:700 1.15rem/1.3 var(--display);margin:1.2em 0 .5em}
h4.mini{font:700 1.02rem var(--body);margin:1.3em 0 .4em;color:var(--brass)}
p,li{max-width:70ch}
.sec ol,.sec ul{padding-left:1.3em}
li{margin:.3em 0}
code{font-size:.88em;background:var(--brass-soft);padding:1px 5px;border-radius:4px}
.tw{overflow-x:auto;margin:14px 0 18px;border:1px solid var(--line);border-radius:6px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{text-align:left;vertical-align:top;padding:7px 10px;border-bottom:1px solid var(--line)}
th{font:600 .72rem var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--panel);white-space:nowrap}
tr:last-child td{border-bottom:0}
tr.stop td{border-top:2px solid var(--brass)}
tr.stop td:first-child strong{color:var(--brass);white-space:nowrap}
tr.silver td{background:var(--brass-soft);font-weight:700}
td:first-child{white-space:nowrap}
.formula{font-size:1.1rem;padding:10px 14px;background:var(--card);border:1px dashed var(--line);border-radius:6px;display:inline-block}
.fig{margin:16px 0 20px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:6px;overflow-x:auto}
.fig svg{width:100%;min-width:560px;height:auto;display:block}
.fig figcaption,.note{color:var(--muted);font-size:.85rem;margin:6px 0 0}
svg text{font-family:var(--body);font-size:12px;fill:var(--ink)}
.grid{stroke:var(--line)} .ax{fill:var(--muted)}
.s1-l{fill:none;stroke:var(--brass);stroke-width:2.5} .s1-f{fill:var(--brass)} .s1-t{fill:var(--brass);font-weight:700}
.s2-l{fill:none;stroke:var(--blue);stroke-width:2.5} .s2-f{fill:var(--blue)} .s2-t{fill:var(--blue);font-weight:700}
.lbl{font-weight:700}
.bx{fill:none;stroke:var(--line);stroke-width:1.4} .bx.main{fill:var(--brass-soft);stroke:var(--brass);stroke-width:2}
.bt{font-size:13px !important;font-weight:700} .bq{fill:var(--muted)}
.con path{fill:none;stroke:var(--muted);stroke-width:1.3} .arh{fill:var(--muted)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 4px}
.tab{font:inherit;cursor:pointer;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px 14px;display:flex;flex-direction:column;align-items:flex-start;gap:0;min-width:130px}
.tab small{color:var(--muted);font-size:.8rem}
.tab[aria-selected="true"]{border-color:var(--brass);background:var(--brass-soft);box-shadow:inset 0 -3px 0 var(--brass);font-weight:700}
.here{font:700 .62rem var(--body);background:var(--brass);color:var(--card);border-radius:3px;padding:1px 5px;margin-left:6px;letter-spacing:.06em;text-transform:uppercase;vertical-align:2px}
.pane[hidden]{display:none}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
.sbar{display:none;margin:0 0 14px;color:var(--muted)}
body.searching .sbar{display:block}
body.searching .glance{display:none}
body.searching .sec{margin-bottom:26px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.empty{padding:30px 0;color:var(--muted)}
.calc{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--brass);border-radius:6px;padding:14px 16px;margin:4px 0 22px}
.calc-in{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end}
.calc-in label{display:flex;flex-direction:column;gap:3px;font:600 .68rem var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.calc-in input{width:118px;font:inherit;font-size:1.05rem;padding:6px 8px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--ink)}
.calc-in input:focus{outline:2px solid var(--brass);outline-offset:1px}
.ghost{font:inherit;font-size:.9rem;cursor:pointer;background:none;border:1px solid var(--line);color:var(--brass);border-radius:5px;padding:7px 10px}
.calc-sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0 4px}
.calc-sum div{border-left:3px solid var(--brass);padding:2px 10px;min-width:0}
.calc-sum span{display:block;font:600 .66rem var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.calc-sum b{font-size:1.15rem}
.calc h4{margin:16px 0 6px;font:700 .95rem var(--body);color:var(--brass)}
.calc ol{margin:0;padding-left:1.3em}
td.num,th.num{text-align:right}
tr.used td{font-weight:700}
.calc-in .chk{flex-direction:row;align-items:center;gap:6px;text-transform:none;letter-spacing:0;font:500 .95rem var(--body);color:var(--ink);padding-bottom:8px}
.calc-in .chk input{width:auto}
.flag{border-left:3px solid var(--good);padding:4px 10px;background:var(--brass-soft)}
.gl-link{text-decoration:none;color:inherit}
.gl-link:hover{border-color:var(--brass)}
@media (max-width:820px){.calc-sum{grid-template-columns:minmax(0,1fr)}.calc-in input{width:100px}}
@media (max-width:820px){
  .wrap{grid-template-columns:minmax(0,1fr);gap:12px;padding-block:12px 50px}
  nav{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:6px;-webkit-overflow-scrolling:touch}
  .ng{display:contents}.ngl{display:none}
  .nv{white-space:nowrap;border:1px solid var(--line);border-left-width:1px;background:var(--card);font-size:.92rem}
  .nv.on{border-color:var(--brass)}
  .glance{grid-template-columns:repeat(2,minmax(0,1fr))}
  h2{font-size:1.35rem}
}
@media (prefers-reduced-motion:no-preference){.sec{animation:fade .18s ease-out}@keyframes fade{from{opacity:.4}to{opacity:1}}}
</style>
<header><div class="hd">
  <div class="brand"><h1>Crafting Profit Plan</h1><span>Leather jackets in Thetford, plate helmets in Fort Sterling · data Apr 1 to Oct 16, 2026</span></div>
  <div class="search"><input id="q" aria-label="Search the plan" type="text" placeholder="Search: T5.2, Martlock, hides, never under…" autocomplete="off"><button type="button" id="qx" aria-label="Clear search" hidden>×</button></div>
</div></header>
<div class="wrap">
  <nav aria-label="Sections">%%NAV%%</nav>
  <main id="main">
    <div class="sbar" id="sbar"></div>
    %%GLANCE%%
    <div id="secs">%%BODY%%</div>
  </main>
</div>
<script>
(function(){
  var secsEl=document.getElementById('secs'), ORIG=secsEl.innerHTML, q=document.getElementById('q'), qx=document.getElementById('qx'), sbar=document.getElementById('sbar');
  var cur='pick', sub={};
  function store(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  function load(k){try{return localStorage.getItem(k)}catch(e){return null}}
  function setTabs(root){
    root.querySelectorAll('.sec').forEach(function(s){
      var tabs=s.querySelectorAll('.tab'); if(!tabs.length) return;
      var k=sub[s.id]!=null?sub[s.id]:1;
      tabs.forEach(function(t){t.setAttribute('aria-selected',String(+t.dataset.sub===+k))});
      s.querySelectorAll('.pane').forEach(function(p){p.hidden=+p.dataset.pane!==+k});
    });
  }
  function show(id,scroll){
    if(!document.getElementById(id)) id='pick';
    cur=id; store('plan-sec',id);
    document.querySelectorAll('.sec').forEach(function(s){s.hidden=s.id!==id});
    document.querySelectorAll('.nv').forEach(function(a){a.classList.toggle('on',a.dataset.go===id)});
    document.querySelector('.glance').hidden=id!=='pick';
    if(scroll) window.scrollTo({top:0});
  }
  document.addEventListener('click',function(e){
    var a=e.target.closest('.nv,.gl-link');
    if(a){e.preventDefault(); if(q.value){q.value='';runSearch()} show(a.dataset.go,true); try{history.replaceState(null,'','#'+a.dataset.go)}catch(_){}; return}
    var t=e.target.closest('.tab');
    if(t){var s=t.closest('.sec'); sub[s.id]=+t.dataset.sub; store('plan-sub-'+s.id,t.dataset.sub); setTabs(document)}
  });
  function esc(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
  function mark(el,re){
    var w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,null),n,list=[];
    while(n=w.nextNode()){ if(n.parentNode.closest('svg')) continue; if(re.test(n.nodeValue)) list.push(n); re.lastIndex=0 }
    list.forEach(function(n){
      var f=document.createDocumentFragment(),s=n.nodeValue,last=0;
      s.replace(re,function(m,i){f.appendChild(document.createTextNode(s.slice(last,i)));var k=document.createElement('mark');k.textContent=m;f.appendChild(k);last=i+m.length;return m});
      f.appendChild(document.createTextNode(s.slice(last))); n.parentNode.replaceChild(f,n);
    });
  }
  function runSearch(){
    var v=q.value.trim(); qx.hidden=!v;
    secsEl.innerHTML=ORIG; setTabs(secsEl);
    if(typeof putAll==='function'){putAll();render()}
    if(v.length<2){document.body.classList.remove('searching'); show(cur); return}
    document.body.classList.add('searching');
    var lv=v.toLowerCase(), re=new RegExp(esc(v),'gi'), hits=0, secHits=0;
    secsEl.querySelectorAll('.sec').forEach(function(s){
      var any=false;
      s.querySelectorAll('.pane').forEach(function(p){p.hidden=false});
      s.querySelectorAll('.tabs').forEach(function(t){t.hidden=true});
      var blocks=s.querySelectorAll('p, li, h4.mini, .formula, figure, tbody tr');
      blocks.forEach(function(b){
        if(b.closest('figure')&&b.tagName!=='FIGURE') return;
        var ok=b.textContent.toLowerCase().indexOf(lv)>=0;
        if(b.tagName==='TR'){
          if(!ok){ var stop=b; } 
        }
        b.hidden=!ok; if(ok){any=true;hits++}
      });
      // keep a matching row's stop label visible for context: show the stop row header city
      s.querySelectorAll('.tw').forEach(function(w){
        var rows=[].slice.call(w.querySelectorAll('tbody tr')), vis=rows.filter(function(r){return !r.hidden});
        if(w.querySelector('thead') && w.querySelector('thead').textContent.toLowerCase().indexOf(lv)>=0){rows.forEach(function(r){r.hidden=false});vis=rows;any=true}
        // add the stop's city to matching loop rows
        var city='';
        rows.forEach(function(r){var c=r.cells[0]; var t=c?c.textContent.trim():''; if(t) city=t; else if(!r.hidden&&city){c.innerHTML='<span class="ax" style="color:var(--muted)">'+city.replace(/</g,'&lt;')+'</span>'}});
        w.hidden=!vis.length;
      });
      s.querySelectorAll('ul,ol').forEach(function(l){l.hidden=![].some.call(l.children,function(li){return !li.hidden})});
      s.querySelectorAll('.pane').forEach(function(p){var h=p.querySelector('h3'); if(h) h.hidden=!p.querySelector('p:not([hidden]),li:not([hidden]),tr:not([hidden]),h4:not([hidden])')});
      var h2=s.querySelector('h2'); if(h2.textContent.toLowerCase().indexOf(lv)>=0) any=true;
      s.hidden=!any; if(any){secHits++; mark(s,re)}
    });
    sbar.textContent=hits? (hits+' match'+(hits===1?'':'es')+' in '+secHits+' section'+(secHits===1?'':'s')+' for “'+v+'”. Clear the search to go back.') : 'Nothing matches “'+v+'”. Try a tier like T4.2, a city, or a word like hides.';
  }

  /* spec calculator. Crafting: efficiency = 30 x family node + 30 x each other item spec in the family + 280 x this item's spec.
     Refining: 30 x each tier's spec in the line + 250 x the refined tier's spec. focus = base x 0.5^(eff/10000). */
  var SP={}, DEF={m:63,a:41,r:16,h:0,f:10000,pm:0,pg:0,ps:0,pk:0,t4:0,t5:0,t6:0,s4:0,s5:0,s6:0,hl:1,bl:0};
  function jEff(t){var o=0;['a','r','h'].forEach(function(k){if(k!==t)o+=SP[k]});return 30*SP.m+30*o+280*SP[t]}
  function hEff(t){var o=0;['pg','ps','pk'].forEach(function(k){if(k!==t)o+=SP[k]});return 30*SP.pm+30*o+280*SP[t]}
  function rEff(p,tier){return 30*(SP[p+'4']+SP[p+'5']+SP[p+'6'])+250*(SP[p+tier]||0)}
  var J=[
    {nm:'T4.3 Assassin Jacket',e:function(){return jEff('a')},base:4596,pf:73656,pn:41173,cap:7,sell:'Lymhurst'},
    {nm:'T8.1 Assassin Jacket',e:function(){return jEff('a')},base:14074,pf:110600,pn:0,cap:1,sell:'Lymhurst'},
    {nm:'T6.2 Assassin Jacket',e:function(){return jEff('a')},base:8042,pf:53539,pn:0,cap:10,sell:'Martlock'},
    {nm:'T5.2 Assassin Jacket',e:function(){return jEff('a')},base:4596,pf:29817,pn:0,cap:34,sell:'Bridgewatch'},
    {nm:'T4.2 Assassin Jacket',e:function(){return jEff('a')},base:2626,pf:16602,pn:8817,cap:77,sell:'Fort Sterling'},
    {nm:'T4.3 Mercenary Jacket',e:function(){return jEff('r')},base:4596,pf:43978,pn:0,cap:7,sell:'Lymhurst'},
    {nm:'T7.3 Assassin Jacket',e:function(){return jEff('a')},base:24630,pf:388513,pn:0,cap:0,sell:'Lymhurst'}];
  var X=[
    {loop:'helmet',on:'hl',nm:'T4.2 Guardian Helmet',e:function(){return hEff('pg')},base:1313,pf:11763,pn:7890,cap:175},
    {loop:'helmet',on:'hl',nm:'T4.2 Soldier Helmet',e:function(){return hEff('ps')},base:1313,pf:10521,pn:6461,cap:26},
    {loop:'helmet',on:'hl',nm:'T4.3 Guardian Helmet',e:function(){return hEff('pg')},base:2298,pf:41677,pn:27349,cap:6},
    {loop:'helmet',on:'hl',nm:'T4.3 Soldier Helmet',e:function(){return hEff('ps')},base:2298,pf:36010,pn:21774,cap:1},
    {loop:'helmet',on:'hl',nm:'T5.2 Guardian Helmet',e:function(){return hEff('pg')},base:2298,pf:29177,pn:17290,cap:24},
    {loop:'helmet',on:'hl',nm:'T5.2 Soldier Helmet',e:function(){return hEff('ps')},base:2298,pf:26493,pn:14365,cap:9},
    {loop:'helmet',on:'hl',nm:'T5.1 Guardian Helmet',e:function(){return hEff('pg')},base:1313,pf:7161,pn:3770,cap:36},
    {loop:'helmet',on:'hl',nm:'T6.1 Guardian Helmet',e:function(){return hEff('pg')},base:2298,pf:22573,pn:7891,cap:9},
    {loop:'leather',nm:'T4.2 leather (refine)',e:function(){return rEff('t',4)},base:164,pf:450,pn:0,cap:2730},
    {loop:'leather',nm:'T5.1 leather (refine)',e:function(){return rEff('t',5)},base:164,pf:457,pn:0,cap:1050},
    {loop:'bars',on:'bl',nm:'T4.2 metal bars',e:function(){return rEff('s',4)},base:164,pf:884,pn:448,cap:2760},
    {loop:'bars',on:'bl',nm:'T4.3 metal bars',e:function(){return rEff('s',4)},base:287,pf:2815,pn:940,cap:765},
    {loop:'bars',on:'bl',nm:'T6.2 metal bars',e:function(){return rEff('s',6)},base:503,pf:8278,pn:2406,cap:78}];
  function fmt(n){return Math.round(n).toLocaleString('en-US')}
  function run(sp){
    var save=SP; SP=sp;
    var js=J.map(function(c){var f=c.base*Math.pow(.5,c.e()/1e4);return Object.assign({},c,{f:f,spf:c.pf/f,gpf:(c.pf-c.pn)/f,n:0})});
    var xs=X.map(function(c){var f=c.base*Math.pow(.5,c.e()/1e4);return Object.assign({},c,{f:f,gpf:(c.pf-c.pn)/f,n:0,act:!c.on||!!sp[c.on]})});
    var left=sp.f, gain=0;
    js.filter(function(c){return c.cap>0}).sort(function(a,b){return b.spf-a.spf}).forEach(function(c){var n=Math.min(c.cap,Math.floor(left/c.f));if(n>0){c.n=n;left-=n*c.f;gain+=n*(c.pf-c.pn)}});
    var jleft=left, xgain=0;
    xs.filter(function(c){return c.act}).sort(function(a,b){return b.gpf-a.gpf}).forEach(function(c){var n=Math.min(c.cap,Math.floor(left/c.f));if(n>0){c.n=n;left-=n*c.f;xgain+=n*(c.pf-c.pn)}});
    SP=save; return {j:js,x:xs,left:left,jleft:jleft,gain:gain,xgain:xgain};
  }
  var GAIN0=run(Object.assign({},DEF,{m:0,a:0,r:0,h:0,f:10000})).gain;
  function milestone(test){for(var L=SP.a;L<=100;L++){if(test(run(Object.assign({},SP,{a:L}))))return L}return null}
  function save(){try{localStorage.setItem('plan-spec2',JSON.stringify(SP))}catch(e){}}
  function putAll(){document.querySelectorAll('[data-k]').forEach(function(el){var k=el.dataset.k;if(el.type==='checkbox')el.checked=!!SP[k];else el.value=SP[k]})}
  function table(rows,cols){return '<div class="tw"><table><thead><tr>'+cols.map(function(c){return '<th'+(c[2]?' class="num"':'')+'>'+c[0]+'</th>'}).join('')+'</tr></thead><tbody>'+rows.map(function(r){return '<tr'+(r.n?' class="used"':'')+'>'+cols.map(function(c){return '<td'+(c[2]?' class="num"':'')+'>'+c[1](r)+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table></div>'}
  function render(){
    var P=run(SP), t43=P.j[0], st=Math.min(SP.m,SP.a), stage=st<30?0:st<75?1:2, prof=2.67+(P.gain-GAIN0)/1e6;
    var usedJ=P.j.filter(function(c){return c.n}), usedX=P.x.filter(function(c){return c.n});
    var steps=usedJ.concat(usedX).map(function(c){return '<li>'+fmt(c.n)+' × '+c.nm+' with focus, '+fmt(c.f)+' focus each</li>'}).join('');
    if(t43.n<7) steps+='<li>The other '+(7-t43.n)+' T4.3 Assassin Jacket'+(7-t43.n>1?'s':'')+' without focus (about 41,000 each)</li>';
    steps+='<li>About '+fmt(P.left)+' focus left over</li>';
    var m1=milestone(function(p){return p.j[0].n>=7}), m2=milestone(function(p){return p.j[0].n>=7&&p.j[1].n>=1}), ms='';
    if(m1!=null&&m1>SP.a) ms+='<li>Assassin '+m1+': your focus covers all 7 T4.3 Assassin Jackets.</li>';
    if(m2!=null&&m2>SP.a) ms+='<li>Assassin '+m2+': one T8.1 Assassin Jacket a day fits on top.</li>';
    if(!ms) ms='<li>Your focus already covers the T4.3 and T8.1 Assassin Jackets. Extra spec now goes to T6.2, T5.2 and T4.2 Assassin Jackets.</li>';
    function warnFor(rows){var beat=rows.filter(function(c){return c.act&&c.gpf>t43.gpf}).sort(function(a,b){return b.gpf-a.gpf});
      if(!beat.length)return '';var top=beat.slice(0,3).map(function(c){return c.nm}).join(', ')+(beat.length>3?' and '+(beat.length-3)+' more':'');
      return '<p class="flag">'+top+' now add'+(beat.length===1?'s':'')+' more per focus point (up to '+beat[0].gpf.toFixed(1)+') than the focus on your T4.3 Assassin Jackets ('+t43.gpf.toFixed(1)+'). Consider moving focus there.</p>'}
    var warn=warnFor(P.x);
    var sum='<div class="calc-sum"><div><span>Stage</span><b>Stage '+(stage+1)+'</b></div><div><span>Jacket loop, estimate</span><b>'+prof.toFixed(2)+'M a day</b></div><div><span>T4.3 Assassin with focus</span><b>'+t43.n+' of 7</b></div></div>';
    var jt=table(P.j,[['Craft (with focus)',function(c){return c.nm}],['Focus each',function(c){return fmt(c.f)},1],['Profit each',function(c){return fmt(c.pf)},1],['Silver per focus',function(c){return c.spf.toFixed(1)},1],['Sell in',function(c){return c.sell}],['Cap per day',function(c){return c.cap||'under 1'},1]]);
    var ef='<div class="tw"><table><thead><tr><th>Jacket</th><th class="num">Focus efficiency</th><th class="num">Focus multiplier</th></tr></thead><tbody>'+['a','r','h'].map(function(k){var e=jEff(k);return '<tr><td>'+{a:'Assassin',r:'Mercenary',h:'Hunter'}[k]+'</td><td class="num">'+fmt(e)+'</td><td class="num">'+Math.pow(.5,e/1e4).toFixed(2)+'</td></tr>'}).join('')+'</tbody></table></div>';
    var OUT={
      'jacket-full':sum+warn+'<h4>Spend your focus like this</h4><ol>'+steps+'</ol><h4>Next spec goals</h4><ul>'+ms+'</ul><h4>Focus cost at this spec</h4>'+jt+ef+'<p class="note">The profit estimate is the doc'+"'"+'s spec-0 figure (2.67M, royal cities, 20M of materials) plus what your jacket focus crafts add over spec 0. Focus on helmets or refining is extra; see those loops.</p>',
      'jacket':sum+warn+'<h4>Spend your focus like this</h4><ol>'+steps+'</ol>'
    };
    ['helmet','leather','bars'].forEach(function(lp){
      var rows=P.x.filter(function(c){return c.loop===lp}), on=rows[0].act, add=rows.reduce(function(s,c){return s+c.n*(c.pf-c.pn)},0);
      var head='<div class="calc-sum"><div><span>Focus left after jackets</span><b>'+fmt(P.jleft)+'</b></div><div><span>Crafts here with focus</span><b>'+(on?fmt(rows.reduce(function(s,c){return s+c.n},0)):'loop off')+'</b></div><div><span>Extra from that focus</span><b>'+(add?fmt(add)+' a day':'none')+'</b></div></div>';
      var best=rows.slice().sort(function(a,b){return b.gpf-a.gpf})[0];
      var line='<p>At this spec the best focus craft here is <strong>'+best.nm+'</strong>: '+fmt(best.f)+' focus for '+fmt(best.pf-best.pn)+' extra silver, '+best.gpf.toFixed(1)+' per focus point. Your T4.3 Assassin Jackets add '+t43.gpf.toFixed(1)+' per focus point.</p>';
      OUT[lp]=head+warnFor(rows)+line+table(rows,[[lp==='helmet'?'Craft':'Refine',function(c){return c.nm}],['Focus each',function(c){return fmt(c.f)},1],['Extra silver from focus',function(c){return fmt(c.pf-c.pn)},1],['Per focus point',function(c){return c.gpf.toFixed(1)},1],['Per day in the loop',function(c){return fmt(c.cap)},1],['With focus',function(c){return c.n?fmt(c.n):'–'},1]]);
    });
    document.querySelectorAll('[data-out]').forEach(function(el){el.innerHTML=OUT[el.dataset.out]||''});
    var g=function(id,v){var el=document.getElementById(id);if(el)el.textContent=v};
    g('g-stage','Stage '+(stage+1)); g('g-spec','Crafter '+SP.m+' · Assassin '+SP.a+' · Merc '+SP.r+(SP.h?' · Hunter '+SP.h:''));
    g('g-prof',prof.toFixed(2)+'M / day'); g('g-focus',t43.n+' × T4.3 Assassin'); g('g-focus2',fmt(t43.f)+' focus each at your spec');
    document.querySelectorAll('.here').forEach(function(h){h.hidden=+h.dataset.stage!==stage});
    if(sub.loop==null){sub.loop=stage;setTabs(document)}
  }
  function readField(el){var k=el.dataset.k;if(el.type==='checkbox')return el.checked?1:0;var mx=+el.max||100,v=Math.round(+el.value);return isNaN(v)?0:Math.max(0,Math.min(mx,v))}
  (function(){
    var saved=null; try{saved=JSON.parse(localStorage.getItem('plan-spec2'))}catch(e){}
    if(!saved){try{var old=JSON.parse(localStorage.getItem('plan-spec'));if(old)saved=old}catch(e){}}
    SP=Object.assign({},DEF,saved||{});
    putAll(); render();
    document.addEventListener('input',function(e){var el=e.target;if(!el.dataset||!el.dataset.k)return;SP[el.dataset.k]=readField(el);
      document.querySelectorAll('[data-k="'+el.dataset.k+'"]').forEach(function(o){if(o!==el){if(o.type==='checkbox')o.checked=el.checked;else o.value=el.value}});save();render()});
    document.addEventListener('change',function(e){var el=e.target;if(el.type==='checkbox'&&el.dataset.k){SP[el.dataset.k]=readField(el);putAll();save();render()}});
    document.addEventListener('click',function(e){if(e.target.closest('.sp-reset')){['m','a','r','h','f'].forEach(function(k){SP[k]=DEF[k]});putAll();save();render()}});
  })();
  var tmr; q.addEventListener('input',function(){clearTimeout(tmr);tmr=setTimeout(runSearch,120)});
  qx.addEventListener('click',function(){q.value='';runSearch();q.focus()});
  document.querySelectorAll('.sec').forEach(function(s){var k=load('plan-sub-'+s.id); if(k!=null) sub[s.id]=+k});
  setTabs(document);
  var h=(location.hash||'').slice(1); show(h&&document.getElementById(h)?h:(load('plan-sec')||'pick'));
})();
</script>
