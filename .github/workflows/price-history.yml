name: Price history snapshot

# Downloads long-run daily prices and volumes for the craft-profit study and commits them to this branch.
on:
  push:
    branches: [claude/project-thread-wzqm2p]
    paths: [tools/fetch_history.py, .github/workflows/price-history.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - run: python3 tools/fetch_history.py 2025-10-01 west T3_ORE,T4_ORE,T4_ORE_LEVEL1@1,T4_ORE_LEVEL2@2,T4_ORE_LEVEL3@3,T5_ORE,T5_ORE_LEVEL1@1,T5_ORE_LEVEL2@2,T5_ORE_LEVEL3@3,T6_ORE,T6_ORE_LEVEL1@1,T6_ORE_LEVEL2@2,T6_ORE_LEVEL3@3,T7_ORE,T7_ORE_LEVEL1@1,T7_ORE_LEVEL2@2,T7_ORE_LEVEL3@3,T8_ORE,T8_ORE_LEVEL1@1,T8_ORE_LEVEL2@2,T8_ORE_LEVEL3@3,T3_WOOD,T4_WOOD,T4_WOOD_LEVEL1@1,T4_WOOD_LEVEL2@2,T4_WOOD_LEVEL3@3,T5_WOOD,T5_WOOD_LEVEL1@1,T5_WOOD_LEVEL2@2,T5_WOOD_LEVEL3@3,T6_WOOD,T6_WOOD_LEVEL1@1,T6_WOOD_LEVEL2@2,T6_WOOD_LEVEL3@3,T7_WOOD,T7_WOOD_LEVEL1@1,T7_WOOD_LEVEL2@2,T7_WOOD_LEVEL3@3,T8_WOOD,T8_WOOD_LEVEL1@1,T8_WOOD_LEVEL2@2,T8_WOOD_LEVEL3@3,T3_FIBER,T4_FIBER,T4_FIBER_LEVEL1@1,T4_FIBER_LEVEL2@2,T4_FIBER_LEVEL3@3,T5_FIBER,T5_FIBER_LEVEL1@1,T5_FIBER_LEVEL2@2,T5_FIBER_LEVEL3@3,T6_FIBER,T6_FIBER_LEVEL1@1,T6_FIBER_LEVEL2@2,T6_FIBER_LEVEL3@3,T7_FIBER,T7_FIBER_LEVEL1@1,T7_FIBER_LEVEL2@2,T7_FIBER_LEVEL3@3,T8_FIBER,T8_FIBER_LEVEL1@1,T8_FIBER_LEVEL2@2,T8_FIBER_LEVEL3@3,T3_HIDE,T4_HIDE,T4_HIDE_LEVEL1@1,T4_HIDE_LEVEL2@2,T4_HIDE_LEVEL3@3,T5_HIDE,T5_HIDE_LEVEL1@1,T5_HIDE_LEVEL2@2,T5_HIDE_LEVEL3@3,T6_HIDE,T6_HIDE_LEVEL1@1,T6_HIDE_LEVEL2@2,T6_HIDE_LEVEL3@3,T7_HIDE,T7_HIDE_LEVEL1@1,T7_HIDE_LEVEL2@2,T7_HIDE_LEVEL3@3,T8_HIDE,T8_HIDE_LEVEL1@1,T8_HIDE_LEVEL2@2,T8_HIDE_LEVEL3@3,T3_ROCK,T4_ROCK,T4_ROCK_LEVEL1@1,T4_ROCK_LEVEL2@2,T4_ROCK_LEVEL3@3,T5_ROCK,T5_ROCK_LEVEL1@1,T5_ROCK_LEVEL2@2,T5_ROCK_LEVEL3@3,T6_ROCK,T6_ROCK_LEVEL1@1,T6_ROCK_LEVEL2@2,T6_ROCK_LEVEL3@3,T7_ROCK,T7_ROCK_LEVEL1@1,T7_ROCK_LEVEL2@2,T7_ROCK_LEVEL3@3,T8_ROCK,T8_ROCK_LEVEL1@1,T8_ROCK_LEVEL2@2,T8_ROCK_LEVEL3@3,T2_METALBAR,T3_METALBAR,T2_PLANKS,T3_PLANKS,T2_CLOTH,T3_CLOTH,T2_LEATHER,T3_LEATHER,T2_STONEBLOCK,T3_STONEBLOCK,T4_STONEBLOCK_LEVEL1@1,T4_STONEBLOCK_LEVEL2@2,T4_STONEBLOCK_LEVEL3@3,T4_STONEBLOCK,T5_STONEBLOCK_LEVEL1@1,T5_STONEBLOCK_LEVEL2@2,T5_STONEBLOCK_LEVEL3@3,T5_STONEBLOCK,T6_STONEBLOCK_LEVEL1@1,T6_STONEBLOCK_LEVEL2@2,T6_STONEBLOCK_LEVEL3@3,T6_STONEBLOCK,T7_STONEBLOCK_LEVEL1@1,T7_STONEBLOCK_LEVEL2@2,T7_STONEBLOCK_LEVE