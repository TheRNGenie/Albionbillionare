name: Price history snapshot

# Downloads long-run daily prices and volumes for the craft-profit study and commits them to this branch.
on:
  push:
    branches: [claude/project-thread-wzqm2p]
    paths: [tools/fetch_history.py, .github/workflows/price-history.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - run: python3 tools/fetch_history.py 2025-10-01 west T2_LEATHER,T3_HIDE,T3_LEATHER,T4_HIDE,T4_HIDE_LEVEL1@1,T4_HIDE_LEVEL2@2,T4_HIDE_LEVEL3@3,T5_HIDE,T5_HIDE_LEVEL1@1,T5_HIDE_LEVEL2@2,T5_HIDE_LEVEL3@3,T6_HIDE,T6_HIDE_LEVEL1@1,T6_HIDE_LEVEL2@2,T6_HIDE_LEVEL3@3 data/history/hides.csv.gz
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/history/
          git commit -m "Price history snapshot $(date -u +%F)"
          git push
