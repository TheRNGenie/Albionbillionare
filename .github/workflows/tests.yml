name: Tests (v2)

# Runs the v2 test suite (Node's built-in test runner, no packages to install) and the lint check on every push to
# the v2 branch and on pull requests. It builds and publishes nothing.
on:
  push:
    branches: [claude/project-thread-m3rrj0]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Tests
        run: npm test

      - name: Lint
        run: npm run lint
