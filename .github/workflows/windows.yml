name: Windows app (v2)

# Builds the Windows desktop app (an Electron window around this web app) and attaches it to a GitHub release.
# The app ships its own data files and only contacts GitHub when the player presses "Check for updates" (Settings page).
# v2 builds are tagged v2-windows-build-N and named Albion-Billionaire-v2-*.exe; the v2 app's update check looks only
# at those, and the original app looks only at windows-build-N, so the two never mix.
# Runs only when started by hand (Actions tab, "Run workflow"). GitHub offers that button only for workflows on the
# repository's default branch, so to build straight from the v2 branch instead, add this under "on:":
#   push:
#     branches: [claude/project-thread-m3rrj0]
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Version the build
        shell: bash
        run: npm version "2.0.${{ github.run_number }}" --no-git-tag-version --allow-same-version

      - name: Build the Windows app
        run: npm run desktop:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - uses: actions/upload-artifact@v4
        with:
          name: albion-billionaire-v2-windows
          path: |
            dist/Albion-Billionaire-v2-portable.exe
            dist/Albion-Billionaire-v2-Setup.exe

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2-windows-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Albion Billionaire v2 for Windows, build ${{ github.run_number }}
          make_latest: false
          files: |
            dist/Albion-Billionaire-v2-portable.exe
            dist/Albion-Billionaire-v2-Setup.exe
          body: |
            Albion-Billionaire-v2-Setup.exe installs the app with a Start menu and desktop shortcut.
            Albion-Billionaire-v2-portable.exe runs without installing (handy on a USB stick); it starts a little slower.
            Windows may say it "protected your PC" because the app isn't code-signed: click More info, then Run anyway.
            Built from ${{ github.sha }}.
